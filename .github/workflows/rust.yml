name: Rust

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  rustfmt:
    name: Check formatting and version dependencies
    runs-on: ubuntu-latest

    steps:
      - name: Checkout sources
        uses: actions/checkout@v7

      - name: Check version dependencies
        run: ./check_version.sh

      - name: Run cargo fmt
        run: cargo fmt --all -- --check

      - name: Run cargo fmt for examples
        run: |
          cargo fmt --all --manifest-path examples/channels/Cargo.toml -- --check
          cargo fmt --all --manifest-path examples/rtc/Cargo.toml -- --check
          cargo fmt --all --manifest-path examples/rtc-web/Cargo.toml -- --check
          cargo fmt --all --manifest-path examples/transports/Cargo.toml -- --check
          cargo fmt --all --manifest-path examples/transports-web/Cargo.toml -- --check

      - name: Run cargo fmt for benchmarks
        run: |
          cargo fmt --all --manifest-path bench/compile/Cargo.toml -- --check
          cargo fmt --all --manifest-path bench/perf/Cargo.toml -- --check

  msrv:
    name: Check with MSRV
    runs-on: ubuntu-latest
    env:
      minrust: 1.95

    steps:
      - name: Checkout sources
        uses: actions/checkout@v7

      - name: Install Rust ${{ env.minrust }}
        run: rustup default ${{ env.minrust }}

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      - name: Run cargo check
        run: cargo check

  # Lints
  build-docs:
    name: Build docs
    needs: [msrv]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout sources
        uses: actions/checkout@v7

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      - name: Build docs
        env:
          RUSTDOCFLAGS: -D rustdoc::broken_intra_doc_links
        run: cargo doc --no-deps

  build-examples:
    name: Build examples
    needs: [msrv]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout sources
        uses: actions/checkout@v7

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            examples/channels
            examples/rtc
            examples/transports

      - name: Build examples
        run: |
          cargo build --manifest-path examples/channels/Cargo.toml --workspace
          cargo build --manifest-path examples/rtc/Cargo.toml --workspace
          cargo build --manifest-path examples/transports/Cargo.toml

  build-examples-web:
    name: Build web examples
    needs: [msrv]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout sources
        uses: actions/checkout@v7

      - name: Install nightly Rust
        run: |
          rustup install nightly
          rustup target add --toolchain nightly wasm32-unknown-unknown

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            examples/transports-web

      - name: Build web examples
        run: |
          cargo +nightly build --manifest-path examples/transports-web/Cargo.toml --target wasm32-unknown-unknown

  build-example-rtc-web:
    name: Build web RTC example
    needs: [msrv]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout sources
        uses: actions/checkout@v7

      - name: Install WebAssembly target
        run: rustup target add wasm32-unknown-unknown

      - name: Install wasm-pack
        uses: baptiste0928/cargo-install@v3
        with:
          crate: wasm-pack

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            examples/rtc-web

      # This builds the browser client with wasm-pack and then the server,
      # which embeds the generated JavaScript and WebAssembly files.
      - name: Build web RTC example
        run: ./examples/rtc-web/build.sh

  build-benchmarks:
    name: Build benchmarks
    needs: [msrv]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout sources
        uses: actions/checkout@v7

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            bench/compile
            bench/perf

      - name: Build benchmarks
        run: |
          cargo build --manifest-path bench/compile/Cargo.toml
          cargo build --manifest-path bench/perf/Cargo.toml

  clippy:
    name: Clippy
    needs: [msrv]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout sources
        uses: actions/checkout@v7

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install nightly Rust
        run: |
          rustup install nightly
          rustup component add --toolchain nightly clippy

      - name: Run clippy
        run: cargo +nightly clippy --tests

  # Tests
  test:
    name: Test with default features
    needs: [msrv]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout sources
        uses: actions/checkout@v7

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      - name: Run cargo test
        run: cargo test

  test-wasm:
    name: Test wasm32-unknown-unknown target
    needs: [msrv]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout sources
        uses: actions/checkout@v7

      - name: Install nightly Rust
        run: |
          rustup install nightly
          rustup target add --toolchain nightly wasm32-unknown-unknown

      - name: Install wasm-bindgen-test-runner
        uses: baptiste0928/cargo-install@v3
        with:
          crate: wasm-bindgen-cli
          version: "0.2.126"

      - name: Install ChromeDriver
        uses: nanasess/setup-chromedriver@v2

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      - name: Run WebAssembly tests
        env:
          CHROMEDRIVER: /usr/local/bin/chromedriver
          WASM_BINDGEN_USE_BROWSER: 1
          WASM_BINDGEN_TEST_TIMEOUT: 90
        run: cargo +nightly test --target wasm32-unknown-unknown --features js --release --tests

  test-codecs:
    name: Test with codec ${{ matrix.codec }}
    needs: [test]
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        codec:
          - json
          - postbag-slim
          - bincode
          - bincode2
          - ciborium
          - message-pack
          - postcard

    steps:
      - name: Checkout sources
        uses: actions/checkout@v7

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      - name: Run cargo test
        env:
          RUSTFLAGS: -A deprecated
        run: cargo test --no-default-features --features full --features default-codec-${{ matrix.codec }}

  test-postbag-fast-compile:
    name: Test with Postbag fast compile
    needs: [test]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout sources
        uses: actions/checkout@v7

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      - name: Run cargo test
        env:
          RUSTFLAGS: --cfg postbag_fast_compile
        run: cargo test

  test-features:
    name: Test ${{ matrix.feature }} feature
    needs: [test]
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        feature:
          - rch
          - rfn
          - robj
          - robs
          - rtc

    steps:
      - name: Checkout sources
        uses: actions/checkout@v7

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      - name: Run cargo test
        run: cargo test --no-default-features --features ${{ matrix.feature }}

  check-features-without-codec:
    name: Check ${{ matrix.feature }} feature without codec
    needs: [test]
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        feature:
          - none
          - rch
          - rfn
          - robj
          - robs
          - rtc

    steps:
      - name: Checkout sources
        uses: actions/checkout@v7

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      - name: Run cargo check
        run: |
          if [ "${{ matrix.feature }}" = "none" ] ; then cargo check --no-default-features ; else \
          cargo check --no-default-features --features ${{ matrix.feature }} ; fi

  # Coverage
  coverage:
    name: Code coverage
    needs: [test-codecs, test-features, check-features-without-codec, rustfmt]
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - name: Checkout sources
        uses: actions/checkout@v7

      - name: Install cargo tarpaulin
        uses: baptiste0928/cargo-install@v3
        with:
          crate: cargo-tarpaulin

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      - name: Run cargo tarpaulin
        shell: bash
        run: cargo tarpaulin --engine llvm --out Xml

      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v7
        with:
          files: cobertura.xml
          token: ${{ secrets.CODECOV_TOKEN }}          
