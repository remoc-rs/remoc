[workspace.package]
version = "0.20.0-pre4"

edition = "2024"
rust-version = "1.95"
license = "Apache-2.0"

homepage = "https://remoc.rs/"
repository = "https://github.com/remoc-rs/remoc/"
authors = [
    "Sebastian Urban <surban@surban.net>",
    "ENQT GmbH <su@enqt.de>",
    "Remoc contributors",
]

[workspace]
resolver = "2"
members = ["remoc", "remoc_macro"]
exclude = ["examples", "bench"]


