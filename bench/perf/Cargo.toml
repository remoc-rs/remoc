[package]
name = "remoc-perf-bench"
version = "0.0.0"
edition = "2024"
publish = false

# Standalone workspace so that benchmark dependencies never affect the Remoc crate.
[workspace]

[dependencies]
remoc = { path = "../../remoc", features = ["codec-bincode"] }

bytes = { version = "1", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }

[profile.release]
debug = true
